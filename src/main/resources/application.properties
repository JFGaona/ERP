# Configuración de la base de datos (SQL Server)
spring.datasource.url=jdbc:sqlserver://serverpdb.database.windows.net:1433;databaseName=erpdb;encrypt=true;trustServerCertificate=false;authentication=ActiveDirectoryDefault
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
logging.level.org.springframework.security=DEBUG
logging.level.com.example.ERP=DEBUG
logging.level.com.example.ERP.security=DEBUG

# Configuración de JWT
jwt.secret=tuClaveSecretaMuyLargaYSegura1234567890
jwt.expiration=86400000